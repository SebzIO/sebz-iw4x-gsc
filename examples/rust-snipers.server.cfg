// =====================
// Basic Server Identity
// =====================
set sv_hostname "^2Sebz's 24/7 Rust Snipers Only ^3[Bots] ^43XP"
set sv_motd "Rust only. Snipers only. Empty pistol for knife. Killstreaks allowed."
set dedicated "2"
set sv_lanonly "0"
set party_enable "0"
set g_password ""
set sv_lanOnly "0"

// =====================
// Admin / RCON
// =====================
set rcon_password "change_me"

// =====================
// Slots
// =====================
set sv_maxclients "18"

// =====================
// Default Gametype / Rotation
// =====================
set g_gametype "dm"
set sv_maprotation "gametype dm map mp_rust"

// =====================
// Map Vote
// =====================
set mapvote_enable "1"
set mapvote_maps "mp_rust"
set mapvote_modes "dm,war,dom,sd,koth,sab,dd,ctf,conf,infect,arena,oneflag,gtnw,vip"
set mapvote_customMaps ""
set mapvote_timer "30"
set mapvote_optionsCount "6"
set mapvote_disable_broken_modes "0"
set mapvote_restricted_maps ""
set mapvote_restricted_modes ""

// =====================
// Rust Snipers Only
// =====================
set rso_default_sniper "cheytac_xmags_mp"
set scr_game_perks "1"
set scr_game_deathstreaks "0"

// =====================
// Bot Warfare
// =====================
set bots_main "1"
set bots_main_menu "0"
set bots_main_debug "0"
set bots_manage_fill "12"
set bots_manage_fill_kick "1"
set bots_team_force "1"
set bots_skill "1"
set bots_main_chat "0"

// =====================
// Logging / XP
// =====================
set logfile "2"
set g_logSync "1"
set g_log "logs/games_mp.log"
set scr_xpscale "3"
set scr_game_allowkillcam "1"
